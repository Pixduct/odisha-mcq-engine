name: Daily Current Affairs Website Publisher

on:
  schedule:
    - cron: '47 */2 * * *'  # Runs once every 2 hours at minute 47 (Off-peak green zone — 12 runs/day)
  workflow_dispatch:

concurrency:
  group: daily-ca-website
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-daily-ca-website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt lxml feedparser python-dateutil

      - name: Run Current Affairs Website Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.NVIDIA_NIM_API_KEY || secrets.OPENAI_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY || secrets.DEEPSEEK_API_KEY }}
          NVIDIA_GPT_OSS_KEY: ${{ secrets.NVIDIA_GPT_OSS_KEY }}
          NVIDIA_NEMOTRON_KEY: ${{ secrets.NVIDIA_NEMOTRON_KEY || secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          python ca_website_publisher.py

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published_ca_history.json published_image_history.json history/telegram_sent_history.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "update: Sync published_ca_history.json and telegram_sent_history.json [skip ci]" && \
             git pull --rebase origin main && \
             git push)

      - name: Dispatch Comprehensive Execution Status to Admin Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c "
          import os, requests, re
          token = os.getenv('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.getenv('TELEGRAM_ADMIN_CHAT_ID', '')
          if not token or not chat_id:
              exit(0)
          status = os.getenv('JOB_STATUS', 'UNKNOWN')
          workflow_name = '${{ github.workflow }}'
          run_url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          if status == 'success':
              msg = f'✅ <b>Automation Execution Notification</b>\n\n⚙️ <b>Workflow:</b> {workflow_name}\n🎯 <b>Status:</b> SUCCESS\n⚡ Runner completed all pipeline steps cleanly.'
          else:
              msg = f'🚨 <b>Automation Run Alert</b>\n\n⚙️ <b>Workflow:</b> {workflow_name}\n⚠️ <b>Status:</b> {status.upper()}\n🔍 <b>Workflow Run Logs:</b> {run_url}'
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          res = requests.post(url, data={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=15)
          if not res.ok:
              plain = re.sub(r'<[^>]+>', '', msg)
              requests.post(url, data={'chat_id': chat_id, 'text': plain}, timeout=15)
          "
