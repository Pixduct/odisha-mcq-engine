name: Exam Update Engine (Engine 1)

on:
  schedule:
    - cron: '17 05 * * *'  # Morning Official Scan: 10:47 AM IST (05:17 UTC) — clean off-peak minute 17
    - cron: '47 12 * * *'  # Evening Gazette Scan:  6:17 PM IST (12:47 UTC) — clean off-peak minute 47
  workflow_dispatch:

concurrency:
  group: exam-update-engine
  cancel-in-progress: false   # Dedicated isolated runner group

permissions:
  contents: write

jobs:
  run-exam-update-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests duckduckgo-search gspread google-auth supabase python-dotenv beautifulsoup4 lxml pillow playwright
          playwright install chromium --with-deps || true

      - name: Run Exam Update Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.NVIDIA_NIM_API_KEY || secrets.OPENAI_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY || secrets.DEEPSEEK_API_KEY }}
          NVIDIA_GPT_OSS_KEY: ${{ secrets.NVIDIA_GPT_OSS_KEY }}
          NVIDIA_NEMOTRON_KEY: ${{ secrets.NVIDIA_NEMOTRON_KEY || secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE || '710722716124' }}
          GREEN_API_TOKEN_INSTANCE: ${{ secrets.GREEN_API_TOKEN_INSTANCE }}
          GREEN_API_HOST: ${{ secrets.GREEN_API_HOST || 'https://7107.api.greenapi.com' }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID || '120363412784897729@g.us' }}
          YOUTUBE_STORAGE_STATE: ${{ secrets.YOUTUBE_STORAGE_STATE || secrets.YT_STATE_BASE64 }}
          YT_STATE_BASE64: ${{ secrets.YT_STATE_BASE64 || secrets.YOUTUBE_STORAGE_STATE }}
        run: |
          python exam_update_engine.py

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_notices.json history/exam_updates_history.json published_image_history.json used_blog_images.json history/telegram_sent_history.json public/blog_covers/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "update: Sync exam_updates_history.json, covers, and telegram_sent_history.json [skip ci]" && \
             for i in 1 2 3 4 5; do
               (git pull --rebase -X theirs --autostash origin main || (git rebase --abort && git pull -X ours origin main --no-edit)) && git push origin main && break || sleep 3
             done)

      - name: Dispatch Comprehensive Execution Status to Admin Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c "
          import os, requests, re
          token = os.getenv('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.getenv('TELEGRAM_ADMIN_CHAT_ID', '')
          if not token or not chat_id:
              exit(0)
          status = os.getenv('JOB_STATUS', 'UNKNOWN')
          workflow_name = '${{ github.workflow }}'
          run_url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          if status == 'success':
              msg = f'✅ <b>Automation Execution Notification</b>\n\n⚙️ <b>Workflow:</b> {workflow_name}\n🎯 <b>Status:</b> SUCCESS\n⚡ Runner completed all pipeline steps cleanly.'
          else:
              msg = f'🚨 <b>Automation Run Alert</b>\n\n⚙️ <b>Workflow:</b> {workflow_name}\n⚠️ <b>Status:</b> {status.upper()}\n🔍 <b>Workflow Run Logs:</b> {run_url}'
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          res = requests.post(url, data={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=15)
          if not res.ok:
              plain = re.sub(r'<[^>]+>', '', msg)
              requests.post(url, data={'chat_id': chat_id, 'text': plain}, timeout=15)
          "
