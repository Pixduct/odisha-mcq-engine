<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      background: {{THEME_BG_COLOR}};
      background-image: 
        radial-gradient(at 0% 0%, {{THEME_RADIAL_1}} 0px, transparent 55%),
        radial-gradient(at 100% 100%, {{THEME_RADIAL_2}} 0px, transparent 55%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.65) 0px, transparent 80%);
      color: #FFF5F5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient geometric dot grid overlay */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.2px, transparent 1.2px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 1;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .category-badge {
      background: {{THEME_BADGE_GRADIENT}};
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 19px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 6px 25px {{THEME_GLOW_COLOR}};
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .board-tag {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #F8FAFC;
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .date-text {
      font-size: 18px;
      color: #E2E8F0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .main-card {
      background: {{THEME_CARD_BG}};
      border: 2px solid {{THEME_BORDER_COLOR}};
      border-radius: 26px;
      padding: 40px 46px;
      flex-grow: 1;
      margin: 22px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 60px {{THEME_GLOW_COLOR}}, inset 0 1px 0 rgba(255, 255, 255, 0.15);
      z-index: 10;
      position: relative;
    }

    .card-header {
      margin-bottom: 18px;
    }

    .exam-board-title {
      font-size: 20px;
      font-weight: 800;
      color: {{THEME_ACCENT_COLOR}};
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .headline {
      font-family: 'Outfit', sans-serif;
      font-size: 33px;
      font-weight: 900;
      line-height: 1.3;
      color: #FFFFFF;
      letter-spacing: -0.2px;
    }

    .bullets-container {
      margin: 12px 0;
    }

    .bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bullets li {
      position: relative;
      padding-left: 36px;
      font-size: 21px;
      line-height: 1.45;
      color: #F1F5F9;
      font-weight: 500;
    }

    .bullets li b {
      color: {{THEME_ACCENT_COLOR}};
      font-weight: 800;
    }

    .bullets li::before {
      content: '{{THEME_BULLET_ICON}}';
      position: absolute;
      left: 4px;
      color: {{THEME_ACCENT_COLOR}};
      font-size: 18px;
      top: 3px;
    }

    .official-portal-strip {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }

    .portal-label {
      font-size: 17px;
      font-weight: 700;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .portal-link {
      font-size: 18px;
      font-weight: 800;
      color: #38BDF8;
      letter-spacing: 0.5px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 20px;
      z-index: 10;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon-sm {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366F1 0%, #3B82F6 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 15px -3px rgba(99, 102, 241, 0.5);
    }

    .brand-icon-sm svg {
      width: 24px;
      height: 24px;
    }

    .website-text {
      font-size: 21px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #CBD5E1;
      letter-spacing: 0.5px;
    }

    .verified-pill {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #6EE7B7;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="category-badge">{{CATEGORY_BADGE}}</div>
    <div class="board-tag">{{BOARD_NAME_SHORT}}</div>
    <div class="date-text">📅 {{DATE}}</div>
  </div>

  <div class="main-card">
    <div class="card-header">
      <div class="exam-board-title">🏛️ {{EXAM_BOARD_FULL}}</div>
      <h1 class="headline">{{HEADLINE}}</h1>
    </div>

    <div class="bullets-container">
      <ul class="bullets">
        {{NEWS_BULLETS}}
      </ul>
    </div>

    <div class="official-portal-strip">
      <div class="portal-label">🌐 Official Notification Source:</div>
      <div class="portal-link">{{OFFICIAL_SOURCE_DOMAIN}}</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <div class="brand-icon-sm">
        <svg viewBox="0 0 256 256">
          <g transform="translate(36, 44)" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M84 16 C64 8, 24 10, 4 22 L4 142 C24 130, 64 128, 84 136 Z" />
            <path d="M84 16 C104 8, 144 10, 164 22 L164 142 C144 130, 104 128, 84 136 Z" />
            <line x1="84" y1="16" x2="84" y2="136" />
          </g>
        </svg>
      </div>
      <div class="website-text">www.odishaexamprep.in</div>
    </div>
    <div class="footer-right">
      <span class="verified-pill">✓ Official Source Verified</span>
      <span>Real-Time Alert 🚀</span>
    </div>
  </div>
</body>
</html>
