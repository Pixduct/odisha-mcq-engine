<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      background: #0F172A;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      padding: 50px;
      overflow: hidden;
      position: relative;
    }
    .accent-bar {
      width: 16px;
      background: linear-gradient(180deg, #8B5CF6, #EC4899);
      border-radius: 10px;
      margin-right: 40px;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
    }
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-badge {
      background: linear-gradient(135deg, #8B5CF6, #7C3AED);
      color: #FFFFFF;
      padding: 12px 26px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }
    .date-text {
      font-size: 20px;
      color: #94A3B8;
      font-weight: 600;
    }
    .main-card {
      background: #1E293B;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px;
      margin: 32px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
    }
    .headline {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.3;
      color: #F8FAFC;
      margin-bottom: 28px;
    }
    .bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .bullets li {
      position: relative;
      padding-left: 38px;
      font-size: 23px;
      line-height: 1.45;
      color: #CBD5E1;
      font-weight: 500;
    }
    .bullets li b {
      color: #FFD166;
      font-weight: 800;
    }
    .bullets li::before {
      content: '★';
      position: absolute;
      left: 4px;
      color: #EC4899;
      font-size: 18px;
      top: 3px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
    }
    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon-sm {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366F1 0%, #3B82F6 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 15px -3px rgba(99, 102, 241, 0.5);
    }
    .brand-icon-sm svg {
      width: 22px;
      height: 22px;
    }
    .website-text {
      font-size: 20px;
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: 0.5px;
    }
    .footer-right {
      font-size: 19px;
      font-weight: 600;
      color: #94A3B8;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="content-area">
    <div class="top-bar">
      <div class="category-badge">{{CATEGORY_TAG}}</div>
      <div class="date-text">{{DATE}}</div>
    </div>

    <div class="main-card">
      <h1 class="headline">{{HEADLINE}}</h1>
      <ul class="bullets">
        {{NEWS_BULLETS}}
      </ul>
    </div>

    <div class="footer">
      <div class="footer-left">
        <div class="brand-icon-sm">
          <svg viewBox="0 0 256 256">
            <g transform="translate(36, 44)" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M84 16 C64 8, 24 10, 4 22 L4 142 C24 130, 64 128, 84 136 Z" />
              <path d="M84 16 C104 8, 144 10, 164 22 L164 142 C144 130, 104 128, 84 136 Z" />
              <line x1="84" y1="16" x2="84" y2="136" />
            </g>
          </svg>
        </div>
        <div class="website-text">www.odishaexamprep.in</div>
      </div>
      <div class="footer-right">
        Daily CA Quiz & Practice 🚀
      </div>
    </div>
  </div>
</body>
</html>
